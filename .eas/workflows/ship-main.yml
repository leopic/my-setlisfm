# Every push to main ships: an OTA update to the `preview` channel when a preview build
# with the same native fingerprint exists, or a new preview build when the native code
# changed (install that build on the simulator by hand).
name: Ship main

on:
  push:
    branches: ['main']

# A ship always finishes. A newer push waits for it and replaces any push already waiting,
# which is fine: the newest commit holds the older ones.
concurrency:
  group: ship-main

# Yarn 4 ships via Corepack (packageManager in package.json); the EAS image has Yarn 1.
defaults:
  tools:
    corepack: true

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    # The same environment as the preview build profile, so the hashes match.
    environment: preview

  get_build:
    name: Find a matching build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build:
    name: Build (native change)
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview

  # A custom job, not the `update` type: that one can't upload source maps, and EAS
  # Observe needs them for readable stack traces.
  update:
    name: Publish update
    needs: [get_build]
    if: ${{ needs.get_build.outputs.build_id }}
    environment: preview
    env:
      # Both are empty for a manual `eas workflow:run`; Settings then shows the update id.
      COMMIT_MESSAGE: ${{ github.commit_message || github.sha }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      # An update without the key crashes every installed build at launch
      # (src/services/setlistApi.ts throws at import).
      - name: Check the setlist.fm key
        run: |
          if [ -z "$SETLISTFM_API_KEY" ]; then
            echo "SETLISTFM_API_KEY is missing from the EAS preview environment" >&2
            exit 1
          fi
      # Custom jobs have EXPO_TOKEN but no `eas` binary on the PATH. EXPO_PUBLIC_COMMIT goes into
      # the bundle, so Settings can show which commit the update holds.
      # eas-cli is pinned to an exact version: it runs with EXPO_TOKEN, so a bad release must not
      # reach it on its own. Dependabot doesn't see this line; bump it by hand.
      - name: Publish to preview
        run: |
          EXPO_PUBLIC_COMMIT="${COMMIT_SHA:0:7}" npx -y eas-cli@27.10.0 update \
            --channel preview \
            --environment preview \
            --platform ios \
            --upload-source-maps \
            --message "$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)" \
            --non-interactive

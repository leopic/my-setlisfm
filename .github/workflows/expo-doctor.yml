name: Expo Doctor

# Scoped to dependency changes rather than every push: expo-doctor reaches out
# to the Expo API, so running it on unrelated commits invites red builds that
# say nothing about the change under review.
on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - yarn.lock
      - app.config.js
  push:
    branches: [main]
    paths:
      - package.json
      - yarn.lock
      - app.config.js

permissions:
  contents: read

concurrency:
  group: expo-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install
        run: yarn install --immutable

      # Catches a dependency drifting off the version the installed SDK pins —
      # the failure mode behind the gesture-handler and webview bumps that had
      # to be closed by hand.
      - name: Expo Doctor
        run: npx expo-doctor

name: E2E

# Runs the seeded Maestro flows against a Release simulator build, so the suite
# can't silently rot again. Scoped to changes that can affect what the app
# renders. The empty-state onboarding flow is left out: it syncs live from
# setlist.fm, which needs a real API key and network access.
on:
  pull_request:
    branches: [main]
    paths:
      - app/**
      - src/**
      - assets/**
      - .maestro/**
      - package.json
      - yarn.lock
      - app.config.js
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - app/**
      - src/**
      - assets/**
      - .maestro/**
      - package.json
      - yarn.lock
      - app.config.js
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  MAESTRO_VERSION: 2.3.0
  # The seeded flows never call setlist.fm, but the API module throws at import
  # time without a key, so the build needs a placeholder.
  SETLISTFM_API_KEY: e2e-placeholder

jobs:
  maestro:
    name: Maestro (iOS)
    # Standard arm64 runner: free on public repos. Do not switch to
    # macos-26-xlarge or another larger runner — those are billed even here.
    runs-on: macos-26
    # Caps the cost of a hung build or simulator.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Yarn 4 ships via Corepack, pinned by the packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      - name: Install
        run: yarn install --immutable

      # ios/ is generated (gitignored), so CI creates it from app.config.js.
      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build Release for simulator
        run: |
          xcodebuild \
            -workspace ios/Chronicles.xcworkspace \
            -scheme Chronicles \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot simulator and install app
        run: |
          UDID=$(xcrun simctl create e2e "iPhone 16 Pro")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/Chronicles.app
          # The seed script writes into the app's SQLite file, which only exists
          # after the app has launched once.
          xcrun simctl launch "$UDID" com.leopicado.chronicles
          for _ in $(seq 1 60); do
            find ~/Library/Developer/CoreSimulator/Devices/"$UDID" -path '*/SQLite/setlistfm.db' | grep -q . && exit 0
            sleep 2
          done
          echo "App database never appeared" >&2
          exit 1

      - name: Run seeded flows
        run: yarn test:e2e

      # Screenshots and logs only — never the .app build — kept for a day, to
      # stay well inside the free artifact storage.
      - name: Upload Maestro output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-output
          path: ~/.maestro/tests/
          retention-days: 1

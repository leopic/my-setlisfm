name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Yarn 4 ships via Corepack, pinned by the packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      # --immutable fails the build if yarn.lock would change, which is what
      # catches a dependency bump that was committed without a lockfile update.
      - name: Install
        run: yarn install --immutable

      # Each check runs even if an earlier one failed, so a red build reports
      # every problem at once instead of one per push.
      - name: Lint
        if: ${{ !cancelled() }}
        run: yarn lint

      - name: Test
        if: ${{ !cancelled() }}
        run: yarn test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

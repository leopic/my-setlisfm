name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The agent workflow starts CI on its PR branch: a PR opened with GITHUB_TOKEN starts none.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # React Doctor diffs against origin/main, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Yarn 4 ships via Corepack, pinned by the packageManager field.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-

      # --immutable fails the build if yarn.lock would change, which is what
      # catches a dependency bump that was committed without a lockfile update.
      - name: Install
        run: yarn install --immutable

      # Each check runs even if an earlier one failed, so a red build reports
      # every problem at once instead of one per push.
      - name: Lint
        if: ${{ !cancelled() }}
        run: yarn lint

      # ESLint's Prettier rule only sees .ts/.tsx; this keeps CLAUDE.md and the READMEs in shape.
      - name: Markdown format
        if: ${{ !cancelled() }}
        run: npx prettier --check '**/*.md'

      - name: Test
        if: ${{ !cancelled() }}
        run: yarn test

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      # Fails on React Doctor issues the change adds, warnings included; old issues in
      # the files it touches don't count. A false positive gets an inline
      # `react-doctor-disable-next-line <rule> -- <reason>`. --no-score and
      # --no-supply-chain keep it offline.
      - name: React Doctor (new issues only)
        if: ${{ !cancelled() }}
        run: yarn react-doctor --scope changed --base origin/main --blocking warning --no-score --no-supply-chain

      # Builds the iOS JavaScript bundle the way an EAS update does. A broken import or
      # a missing asset fails here; tsc and Jest can both miss them.
      - name: Bundle
        if: ${{ !cancelled() }}
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export"

version: 2

updates:
  # Without this file Dependabot only ever opened security PRs, so routine
  # freshness drifted silently — the Expo SDK sat nine patches behind with
  # nothing reporting it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # One PR a week for the low-risk bumps rather than one per package.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Every package listed in expo/bundledNativeModules.json is owned by the
      # SDK, and `expo install --fix` is the only supported way to move one.
      # These are ignored outright rather than majors-only: the SDK pins some
      # of them exactly (react-native-webview, react-native-maps), so even a
      # patch bump desynchronises the install and turns expo-doctor red. Run
      # `npx expo install --fix` to advance them together.
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: "@expo/*"
      - dependency-name: jest-expo
      # jest is pinned in practice by jest-expo, which depends on one jest
      # major (babel-jest, jest-snapshot, jest-environment-*). Bumping jest
      # alone installs two majors side by side and leaves the runner and the
      # preset's machinery on different versions. It moves when jest-expo
      # does, with the SDK, which is also why package.json excludes jest from
      # expo-doctor's version check (see CLAUDE.md).
      - dependency-name: jest
      - dependency-name: "@types/jest"
      - dependency-name: react
      - dependency-name: react-dom
      # expo-doctor checks the React type packages against the SDK too.
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: react-native
      - dependency-name: react-native-gesture-handler
      - dependency-name: react-native-maps
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: react-native-svg
      - dependency-name: react-native-webview
      - dependency-name: react-native-worklets
      # The test renderers can't run ahead of react and react-native: a newer
      # @react-native/jest-preset looks for files an older react-native doesn't
      # ship, and test-renderer tracks react's version. They move with the SDK,
      # like the packages above.
      - dependency-name: "@react-native/jest-preset"
      - dependency-name: test-renderer

  # The workflow actions had gone three majors stale and were running on a
  # deprecated Node runtime before anything flagged it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

appId: com.leopicado.chronicles
name: Venues → Continents → continent detail → back chain
---
# Reuse the running app: restarting it between flows races Maestro's
# iOS driver on slow CI runners (it reports the relaunched app as "not running").
- launchApp:
    stopApp: false
- tapOn:
    text: "Venues"
- assertVisible:
    id: "venues-screen"
- tapOn:
    id: "nav-continents"
- assertVisible:
    id: "continents-screen"
- tapOn:
    id: "continent-.*"
    index: 0
- assertVisible:
    id: "back-button"
- tapOn:
    id: "back-button"
- assertVisible:
    id: "continents-screen"
- tapOn:
    id: "back-button"
- assertVisible:
    id: "venues-screen"

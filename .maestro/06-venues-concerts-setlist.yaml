appId: com.leopicado.chronicles
name: Venues → venue concerts → setlist → back chain
---
# Reuse the running app: restarting it between flows races Maestro's
# iOS driver on slow CI runners (it reports the relaunched app as "not running").
- launchApp:
    stopApp: false
- tapOn:
    text: "Venues"
- assertVisible:
    id: "venues-screen"
- scroll
- tapOn:
    id: "venue-.*"
    index: 0
- assertVisible:
    id: "venue-concerts-screen"
- tapOn:
    id: "venue-concert-.*"
    index: 0
- assertVisible:
    id: "setlist-screen"
- tapOn:
    id: "back-button"
- assertVisible:
    id: "venue-concerts-screen"
- tapOn:
    id: "back-button"
- assertVisible:
    id: "venues-screen"

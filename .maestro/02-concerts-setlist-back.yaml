appId: com.leopicado.chronicles
name: Concerts → setlist → back
---
# Reuse the running app: restarting it between flows races Maestro's
# iOS driver on slow CI runners (it reports the relaunched app as "not running").
- launchApp:
    stopApp: false
- tapOn:
    text: "Concerts"
- assertVisible:
    id: "concerts-screen"
- tapOn:
    id: "concert-.*"
    index: 0
- assertVisible:
    id: "setlist-screen"
- tapOn:
    id: "back-button"
- assertVisible:
    id: "concerts-screen"

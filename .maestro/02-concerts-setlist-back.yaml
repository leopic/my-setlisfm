appId: com.leopicado.chronicles
name: Concerts → setlist → back
---
- launchApp
- tapOn:
    text: "Concerts"
- assertVisible:
    id: "concerts-screen"
- tapOn:
    id: "concert-.*"
    index: 0
- assertVisible:
    id: "setlist-screen"
- tapOn:
    id: "back-button"
- assertVisible:
    id: "concerts-screen"

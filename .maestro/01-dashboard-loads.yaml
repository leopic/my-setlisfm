appId: com.leopicado.chronicles
name: Dashboard loads with seeded data
---
# Reuse the running app: restarting it between flows races Maestro's
# iOS driver on slow CI runners (it reports the relaunched app as "not running").
- launchApp:
    stopApp: false
- tapOn:
    text: "Dashboard"
- assertVisible:
    id: "dashboard-screen"
- assertVisible: "8 shows · 5 artists · 3 countries"
- assertVisible: "Last synced: .*"

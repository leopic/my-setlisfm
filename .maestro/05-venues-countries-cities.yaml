appId: com.leopicado.chronicles
name: Venues → Countries → country detail → back
---
# Reuse the running app: restarting it between flows races Maestro's
# iOS driver on slow CI runners (it reports the relaunched app as "not running").
- launchApp:
    stopApp: false
- tapOn:
    text: "Venues"
- assertVisible:
    id: "venues-screen"
# On an iPhone the way into places is the globe menu in the header.
- tapOn: "Browse by place"
- tapOn:
    # iOS may read a menu item with its subtitle ("Countries, 2 …").
    text: "Countries.*"
- assertVisible:
    id: "countries-screen"
- tapOn:
    id: "back-button"
- assertVisible:
    id: "venues-screen"

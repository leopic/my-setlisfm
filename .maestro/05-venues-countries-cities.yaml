appId: com.leopicado.chronicles
name: Venues → Countries → country detail → back
---
- launchApp
- tapOn:
    text: "Venues"
- assertVisible:
    id: "venues-screen"
- tapOn:
    id: "nav-countries"
- assertVisible:
    id: "countries-screen"
- tapOn:
    id: "back-button"
- assertVisible:
    id: "venues-screen"

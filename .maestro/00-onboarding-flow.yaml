appId: com.leopicado.chronicles
name: Onboarding → sync → dashboard
tags:
  - empty-state
---
# Expects an empty database: run via `yarn test:e2e:empty`
- launchApp

# With no stored username the app must open on onboarding
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 10000

# Onboarding flow — syncs live from setlist.fm, then hands off to the dashboard
- tapOn: "Your setlist.fm username"
- inputText: "leopic"
- tapOn: "Get Started"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen"
    timeout: 400000

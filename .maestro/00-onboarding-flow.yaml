appId: com.leopicado.chronicles
name: Onboarding → sync → dashboard
tags:
  - empty-state
---
# Expects an empty database: run via `yarn test:e2e:empty`
- launchApp

# Wait for onboarding screen (app may need time to reload after reset)
- extendedWaitUntil:
    visible: "Welcome to Chronicles"
    timeout: 10000

# Onboarding flow
- assertVisible: "Track every concert you attend"
- tapOn: "Your setlist.fm username"
- inputText: "leopic"
- tapOn: "Get Started"
- extendedWaitUntil:
    visible: "All set!"
    timeout: 120000
- tapOn: "Let’s Go"
- assertVisible:
    id: "dashboard-screen"
